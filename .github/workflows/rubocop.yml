name: RuboCop

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.329.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop -f github
