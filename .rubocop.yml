inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - .git/**/*
    - .github/**/*
    - bin/**/*
    - coverage/**/*
    - doc/**/*
    - gemfiles/*
    - tmp/**/*
    - vendor/**/*

Naming/PredicatePrefix:
  AllowedMethods:
    - has_attribute?

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 5

Style/ReturnNil:
  Enabled: true
